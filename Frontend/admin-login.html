<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraMart | Admin Portal Login</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-app);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-xl);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: var(--warning);
        }

        .login-logo {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 15px;
            display: inline-block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--bg-surface-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .input-wrapper input:focus {
            background: var(--bg-surface);
            border-color: var(--warning);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-lg);
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast-success {
            border-left: 4px solid var(--success);
        }

        .toast-error {
            border-left: 4px solid var(--danger);
        }

        .toast-icon {
            font-size: 1.2rem;
        }

        .toast-success .toast-icon {
            color: var(--success);
        }

        .toast-error .toast-icon {
            color: var(--danger);
        }
    </style>
</head>

<body>

    <div class="login-card" style="border-top: 4px solid var(--warning);">
        <div class="login-header">
            <a href="/" class="login-logo"><span class="logo-accent"
                    style="background: linear-gradient(135deg, var(--warning), #f59e0b); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Aura</span>Mart
                Admin</a>
            <h2>Owner Portal</h2>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">Authentication required to manage inventory,
                catalog and packing runs.</p>
        </div>

        <form id="auth-form">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" required placeholder="admin@auramart.com">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn w-full" style="margin-top: 10px; background: var(--warning); color: black;"
                id="submit-btn" disabled>
                Sign In As Admin
            </button>
        </form>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        const authForm = document.getElementById("auth-form");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const submitBtn = document.getElementById("submit-btn");

        function checkInputs() {
            submitBtn.disabled = !(emailInput.value.trim() && passwordInput.value);
        }

        emailInput.addEventListener("input", checkInputs);
        passwordInput.addEventListener("input", checkInputs);

        authForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "Processing Auth...";

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || "Authentication failed");
                }

                // Verify user has the required admin role
                const user = data.user || data;
                if (user.role !== "owner" && user.role !== "admin") {
                    throw new Error("Access Denied: You do not have administration clearance.");
                }

                showToast("Cleared! Accessing dashboard...", "success");

                // Save Admin session details
                localStorage.setItem("admin_token", data.token);
                localStorage.setItem("admin_user", JSON.stringify(user));

                setTimeout(() => {
                    window.location.href = "/admin.html";
                }, 1000);
            } catch (err) {
                showToast(err.message, "error");
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In As Admin";
            }
        });

        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <i class="toast-icon fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
                <div>${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = "0";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>

</html>
